{% extends 'base.html' %} {% block content %}

{% if duplicate_count > 0 %}
<div class="alert alert-info">
  <strong>Info:</strong> Removed {{ duplicate_count }} duplicate transaction{% if duplicate_count != 1 %}s{% endif %} that already exist in Actual.
</div>
{% endif %}

<form
  action="{{ url_for('main.push_to_actual') }}"
  method="post"
  enctype="multipart/form-data"
>
  <table>
    {{ table | safe}}
  </table>

  <br />
  <input type="submit" id="push-to-ynab-button-bottom" value="Send to Actual" />
</form>

{% endblock %}
